phase: F1            # F1 = ibex35 | F2 = ibex35 + nasdaq100 | F3 = mercados con ficha lista, de uno en uno
markets_by_phase:
  F1: [ibex35]
  F2: [ibex35, nasdaq100]
  F3: ready_markets   # mercados con status ready|viable|partial en configs/markets/ (ADR 0011: sin filtro de accesibilidad)
filters:
  min_traded_value_20d_local: null  # moneda local por mercado (P6 34a); por definir antes de reportar financieras
start_date: null                    # por mercado, en configs/indices/
# Umbrales de cobertura del indice: ver preregistered.yaml (index_coverage)
# Composición histórica (ADR 0032). usable_from: primera fecha desde la que se usa la composición;
# antes es reconstrucción retroactiva de BME, sin contraste y con 8 miembros sin identificar
# (los precios de Yahoo empiezan hacia 1993). fully_resolved_from: primera fecha sin ningún miembro
# sin identificar (se comprueba en tests/unit/test_membership.py); entre ambas fechas hay hasta 2.
index_membership:
  ibex35:
    usable_from: 1993-01-04
    fully_resolved_from: 1997-10-01
    # Primera fecha con precios de Yahoo (Madrid empieza el 2000-01-03; ADR 0033). P1-0 y los
    # resultados con precios usan desde aqui; antes de esta fecha hay composicion pero no precios.
    prices_from: 2000-01-03
